<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
    <rect width="800" height="480" rx="16" fill="#080c18" stroke="#1d263b" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect width="800" height="42" rx="16" fill="#0d1424"/>
    <rect y="32" width="800" height="10" fill="#0d1424"/>
    <line x1="0" y1="42" x2="800" y2="42" stroke="#1d263b" stroke-width="1"/>
    
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    
    <text x="400" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WebGL Engine Inspector • Scene Graph &amp; Shaders (Three.js r128)</text>
    
    <rect x="688" y="12" width="92" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="734" y="25" fill="#6ee7b7" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">60.0 FPS • 16.6ms</text>

    <!-- Main Viewport (3D Scene Wireframe Representation) -->
    <rect x="24" y="60" width="520" height="396" rx="12" fill="#050811" stroke="#1e293b"/>
    
    <!-- Wireframe Torus Knot Geometric Path -->
    <path d="M 284 160 C 360 120, 420 220, 360 300 C 300 380, 200 320, 220 240 C 240 160, 340 140, 380 200 C 420 260, 320 340, 240 300 C 180 260, 220 180, 284 160 Z" stroke="#00f5ff" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 284 160 C 330 140, 390 200, 340 280 C 280 340, 220 290, 230 230 C 240 180, 310 160, 360 210 C 390 250, 310 320, 260 280 Z" stroke="#ff007f" stroke-width="1.5" fill="none" opacity="0.5"/>
    <circle cx="284" cy="240" r="90" stroke="#8a2be2" stroke-width="1" stroke-dasharray="4" fill="none" opacity="0.3"/>
    <circle cx="284" cy="240" r="130" stroke="#00f5ff" stroke-width="0.7" stroke-dasharray="6" fill="none" opacity="0.2"/>

    <!-- Light positions -->
    <circle cx="180" cy="140" r="6" fill="#00f5ff"/>
    <text x="180" y="125" fill="#00f5ff" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Light 1 (Cyan)</text>

    <circle cx="420" cy="150" r="6" fill="#ff007f"/>
    <text x="420" y="135" fill="#ff007f" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Light 2 (Magenta)</text>

    <circle cx="390" cy="380" r="6" fill="#ffaa00"/>
    <text x="390" y="405" fill="#ffaa00" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Light 3 (Amber)</text>

    <!-- Side Inspector Panel -->
    <rect x="560" y="60" width="216" height="396" rx="12" fill="#0c1220" stroke="#1f293d"/>
    <text x="578" y="90" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Scene Hierarchy</text>

    <text x="578" y="122" fill="#38bdf8" font-family="monospace" font-size="11">▾ Scene</text>
    <text x="594" y="142" fill="#94a3b8" font-family="monospace" font-size="11">▸ PerspectiveCamera (60°)</text>
    <text x="594" y="162" fill="#cbd5e1" font-family="monospace" font-size="11">▾ knotGroup</text>
    <text x="610" y="182" fill="#34d399" font-family="monospace" font-size="11">• TorusKnot (160x32)</text>
    <text x="610" y="202" fill="#64748b" font-family="monospace" font-size="11">• IcosahedronCage</text>
    <text x="610" y="222" fill="#64748b" font-family="monospace" font-size="11">• 4x Satellites</text>
    <text x="594" y="242" fill="#38bdf8" font-family="monospace" font-size="11">• ParticleBuffer (1000)</text>

    <line x1="560" y1="262" x2="776" y2="262" stroke="#1f293d"/>

    <text x="578" y="288" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Material Shader Parameters</text>
    <text x="578" y="312" fill="#64748b" font-family="monospace" font-size="11">type: MeshPhysicalMaterial</text>
    <text x="578" y="332" fill="#64748b" font-family="monospace" font-size="11">metalness: 0.90</text>
    <text x="578" y="352" fill="#64748b" font-family="monospace" font-size="11">roughness: 0.12</text>
    <text x="578" y="372" fill="#64748b" font-family="monospace" font-size="11">clearcoat: 1.00</text>
    <text x="578" y="392" fill="#64748b" font-family="monospace" font-size="11">blending: Additive</text>

    <rect x="578" y="414" width="180" height="26" rx="6" fill="#141c2e"/>
    <text x="668" y="431" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Draw Calls: 6 • VRAM: 14MB</text>
</svg>
