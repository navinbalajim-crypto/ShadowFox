<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
    <rect width="800" height="480" rx="16" fill="#070a14" stroke="#1e2238" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect width="800" height="42" rx="16" fill="#0d1222"/>
    <rect y="32" width="800" height="10" fill="#0d1222"/>
    <line x1="0" y1="42" x2="800" y2="42" stroke="#1e2238" stroke-width="1"/>
    
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5" fill="#10b981"/>
    
    <text x="400" y="26" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Longitudinal Skilling &amp; Employability Impact Analytics Platform (FastAPI + React + JWT)</text>
    
    <rect x="680" y="12" width="100" height="18" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="730" y="25" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">RBAC: VERIFIED</text>

    <!-- Top KPI Row -->
    <rect x="24" y="60" width="176" height="76" rx="10" fill="#0f1526" stroke="#1f293d"/>
    <text x="40" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">EMPLOYABILITY INDEX</text>
    <text x="40" y="116" fill="#10b981" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">86.4%</text>
    <text x="125" y="115" fill="#059669" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">+12% YoY</text>

    <rect x="216" y="60" width="176" height="76" rx="10" fill="#0f1526" stroke="#1f293d"/>
    <text x="232" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">SKILL GAP DEFICIT</text>
    <text x="232" y="116" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">-8.2%</text>
    <text x="317" y="115" fill="#0284c7" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Optimal</text>

    <rect x="408" y="60" width="176" height="76" rx="10" fill="#0f1526" stroke="#1f293d"/>
    <text x="424" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PLACEMENT FORECAST</text>
    <text x="424" y="116" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">High</text>
    <text x="490" y="115" fill="#9333ea" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Q3 Tier-1</text>

    <rect x="600" y="60" width="176" height="76" rx="10" fill="#0f1526" stroke="#1f293d"/>
    <text x="616" y="82" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">ACTIVE COHORTS</text>
    <text x="616" y="116" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="26" font-weight="800">1,240</text>
    <text x="695" y="115" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Students</text>

    <!-- Main Analytics Graph Section -->
    <rect x="24" y="152" width="480" height="308" rx="12" fill="#0c111f" stroke="#1f293d"/>
    <text x="44" y="180" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Longitudinal Skill Growth Over Semesters</text>
    <text x="44" y="198" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Data validation via Pydantic • Stored in PostgreSQL</text>

    <!-- Chart Grid Lines -->
    <line x1="44" y1="230" x2="480" y2="230" stroke="#172238" stroke-dasharray="4"/>
    <line x1="44" y1="280" x2="480" y2="280" stroke="#172238" stroke-dasharray="4"/>
    <line x1="44" y1="330" x2="480" y2="330" stroke="#172238" stroke-dasharray="4"/>
    <line x1="44" y1="380" x2="480" y2="380" stroke="#172238" stroke-dasharray="4"/>
    <line x1="44" y1="420" x2="480" y2="420" stroke="#334155"/>

    <!-- Chart Curves -->
    <!-- Curve 1 (Observed Competency) -->
    <path d="M 50 390 Q 150 360, 240 310 T 360 250 T 470 210" fill="none" stroke="#6366f1" stroke-width="3"/>
    <!-- Curve 2 (Industry Target Baseline) -->
    <path d="M 50 360 Q 150 320, 240 280 T 360 260 T 470 240" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6"/>

    <!-- Data Points -->
    <circle cx="240" cy="310" r="4" fill="#6366f1"/>
    <circle cx="360" cy="250" r="4" fill="#6366f1"/>
    <circle cx="470" cy="210" r="6" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>

    <!-- Chart X Labels -->
    <text x="50" y="440" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Sem 1</text>
    <text x="150" y="440" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Sem 2</text>
    <text x="240" y="440" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Sem 3</text>
    <text x="360" y="440" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Sem 4</text>
    <text x="470" y="440" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10">Current</text>

    <!-- Chart Legend -->
    <rect x="300" y="168" width="8" height="8" rx="2" fill="#6366f1"/>
    <text x="314" y="176" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Measured Outcomes</text>
    <rect x="420" y="168" width="8" height="8" rx="2" fill="#38bdf8"/>
    <text x="434" y="176" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="10">Market Benchmark</text>

    <!-- Side Panel: Category Breakdown -->
    <rect x="520" y="152" width="256" height="308" rx="12" fill="#0c111f" stroke="#1f293d"/>
    <text x="540" y="180" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Skill Domain Breakdown</text>

    <!-- Skill 1 -->
    <text x="540" y="215" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Core DSA &amp; Java</text>
    <text x="740" y="215" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">92%</text>
    <rect x="540" y="224" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="540" y="224" width="198" height="6" rx="3" fill="#10b981"/>

    <!-- Skill 2 -->
    <text x="540" y="255" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">FastAPI &amp; REST Services</text>
    <text x="740" y="255" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">88%</text>
    <rect x="540" y="264" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="540" y="264" width="190" height="6" rx="3" fill="#38bdf8"/>

    <!-- Skill 3 -->
    <text x="540" y="295" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">React.js &amp; TypeScript</text>
    <text x="740" y="295" fill="#6366f1" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">85%</text>
    <rect x="540" y="304" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="540" y="304" width="183" height="6" rx="3" fill="#6366f1"/>

    <!-- Skill 4 -->
    <text x="540" y="335" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">PostgreSQL Schema Design</text>
    <text x="740" y="335" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">82%</text>
    <rect x="540" y="344" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="540" y="344" width="177" height="6" rx="3" fill="#a855f7"/>

    <!-- Skill 5 -->
    <text x="540" y="375" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">AI &amp; LLM Systems</text>
    <text x="740" y="375" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">80%</text>
    <rect x="540" y="384" width="216" height="6" rx="3" fill="#1e293b"/>
    <rect x="540" y="384" width="172" height="6" rx="3" fill="#f59e0b"/>

    <!-- Auth Badge -->
    <rect x="540" y="414" width="216" height="32" rx="6" fill="#171e33"/>
    <text x="648" y="434" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">JWT Protected Endpoint /api/v1/metrics</text>
</svg>
